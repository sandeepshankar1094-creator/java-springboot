name: Deploy to AKS

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Connect to AKS
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group my-resource-group \
            --name my-aks-cluster \
            --overwrite-existing

      # Deploy Kubernetes manifests
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/

      # Verify deployment
      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/my-app \
            --namespace default \
            --timeout=5m